resources:
  jobs:
    Olist_End_to_End_Pipeline:
      name: Olist_End_to_End_Pipeline
      tasks:
        - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: /Repos/elmerahykhadija700@gmail.com/ecommerce-pipeline-v2-azure-databricks/Notebooks/01_bronze
            source: WORKSPACE
          environment_key: Default
        - task_key: Transformation_Silver
          depends_on:
            - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: /Repos/elmerahykhadija700@gmail.com/ecommerce-pipeline-v2-azure-databricks/Notebooks/02_silver
            source: WORKSPACE
        - task_key: Modelisation_Gold
          depends_on:
            - task_key: Transformation_Silver
          notebook_task:
            notebook_path: /Repos/elmerahykhadija700@gmail.com/ecommerce-pipeline-v2-azure-databricks/Notebooks/03_gold
            source: WORKSPACE
      git_source:
        git_url: https://github.com/elmerahykhadija/ecommerce-pipeline-v2-azure-databricks.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
